name: Matrix Workflow

on:
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        version:
          - v1
          - v2
          - v3

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run version
        run: |
          echo "Running ${{ matrix.version }} on ${{ matrix.os }}"

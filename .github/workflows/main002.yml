name: Sequential Build

on:
  workflow_dispatch:

jobs:
  build-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Building V1"

  build-v2:
    needs: build-v1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Building V2"

  build-v3:
    needs: build-v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Building V3"
